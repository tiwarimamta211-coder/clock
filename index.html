<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>मेरी डिजिटल घड़ी</title>
    <style>
        /* CSS: घड़ी को सुंदर बनाने के लिए */
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        #clock {
            font-size: 80px;
            color: #2ecc71;
            background: #1a252f;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 5px solid #34495e;
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <script>
        // JS: घड़ी को चलाने का लॉजिक
        function updateTime() {
            const now = new Date(); // वर्तमान समय लेना
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // समय को 00:00:00 के फॉर्मेट में लाना (अगर 10 से कम हो तो आगे 0 जोड़ना)
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            const timeString = hours + ":" + minutes + ":" + seconds;
            
            // HTML के अंदर टाइम डालना
            document.getElementById("clock").innerHTML = timeString;
        }

        // हर 1 सेकंड (1000ms) में updateTime फंक्शन को चलाना
        setInterval(updateTime, 1000);

        // पेज खुलते ही घड़ी शुरू करना
        updateTime();
    </script>

</body>
</html>
